[pytest]
testpaths = tests
python_files = test_*.py
addopts = -q --no-header

# Keep pytest's scratch space inside the project. The system temp directory
# is not always writable (locked-down CI images, sandboxed runners), and the
# default location makes the `tmp_path` fixture fail at setup with WinError 5.
tmp_path_retention_count = 1
tmp_path_retention_policy = failed

filterwarnings =
    ignore::DeprecationWarning:paddle.*
    ignore::DeprecationWarning:importlib._bootstrap
