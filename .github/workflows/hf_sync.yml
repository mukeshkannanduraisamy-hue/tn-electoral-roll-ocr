name: Sync to Hugging Face Hub

on:
  push:
    branches: [ main, feat/agentic-db-chatbot ]

jobs:
  sync-to-hub:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Push apps/api subtree to Hugging Face
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          git config --global user.email "actions@github.com"
          git config --global user.name "GitHub Actions"
          git remote add hf https://Mukesh29:${HF_TOKEN}@huggingface.co/spaces/Mukesh29/OCR
          git subtree push --prefix apps/api hf main --squash
