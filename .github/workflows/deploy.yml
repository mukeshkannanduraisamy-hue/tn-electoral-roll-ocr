name: Remote CD (Auto-Deploy)

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploying to VPS via SSH
        uses: appleboy/ssh-action@master
        with:
          host: 103.204.169.80
          username: root
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          script: /home/sridhar/web/tn-electoral-roll-ocr/deploy.sh
