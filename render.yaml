services:
  # ---------------------------------------------------------------------------
  # 1. FastAPI Backend OCR Service
  # ---------------------------------------------------------------------------
  - type: web
    name: tamil-nadu-ocr-api
    env: python
    region: singapore
    plan: starter
    buildCommand: "pip install -r apps/api/requirements.txt"
    startCommand: "python -m uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    rootDir: apps/api
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.0"
      - key: DATA_DIR
        value: "/tmp/data"

  # ---------------------------------------------------------------------------
  # 2. Next.js Frontend Web App
  # ---------------------------------------------------------------------------
  - type: web
    name: tamil-nadu-ocr-web
    env: node
    region: singapore
    plan: starter
    buildCommand: "npm install && npm run build"
    startCommand: "npm run start"
    rootDir: apps/web
    envVars:
      - key: NODE_VERSION
        value: "20.10.0"
      - key: NEXT_PUBLIC_API_BASE
        value: "https://tamil-nadu-ocr-api.onrender.com"
